[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prosthesis-sim"
version = "0.1.0"
description = "Modular MuJoCo/MyoSuite/MotorNet sandbox for Ferienakademie 2026 Course 3."
requires-python = ">=3.10,<3.12"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
